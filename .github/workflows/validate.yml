name: Validate

# Security posture for a public repository (Atlassian OSS / Credo requirement):
#
#   * `pull_request` — NOT `pull_request_target`. PR code is executed by npm and the
#     validators, so both jobs skip forks. Same-repository PRs receive a read-only token.
#   * The release job uses only the GitHub-provided token, with write permission confined
#     to that job and to pushes on main. Do not add repository secrets to this workflow.
#   * A fork can change this workflow in its PR. Before making the repository public,
#     enable Settings → Actions → General → "Require approval for all external contributors".
#     For private forks, do not send secrets or write tokens, and require approval.
#
# See https://securitylab.github.com/research/github-actions-preventing-pwn-requests/

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege, applied to every job in this workflow.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate plugins and formatting
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # Pinned deliberately: `plugin validate --strict` gates what beta users receive,
      # so an unpinned CLI could change the verdict without a commit here.
      - name: Validate marketplace manifest
        run: npx --yes @anthropic-ai/claude-code@2.1.186 plugin validate . --strict

      - name: Validate jira plugin
        run: npx --yes @anthropic-ai/claude-code@2.1.186 plugin validate plugins/jira --strict

      # Codex has no `plugin validate`; `plugin add` is the closest check. It parses both
      # manifests and resolves the marketplace source path, failing non-zero on invalid
      # JSON or a missing plugin directory. Pinned for the same reason as the Claude CLI.
      - name: Validate Codex marketplace
        run: |
          npx --yes @openai/codex@0.160.1 plugin marketplace add .
          npx --yes @openai/codex@0.160.1 plugin add jira@atlassian-beta-marketplace

  test:
    name: Tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run repository and plugin tests
        run: npm test

      - name: Check release version against main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: node scripts/release-version.mjs --base origin/main

  release:
    # The upstream release PR supplies the plugin version. Publish that exact version
    # instead of calculating a second one from this repository's commit messages.
    name: Publish plugin release
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [validate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check plugin release version
        id: version
        run: node scripts/release-version.mjs

      - name: Create GitHub prerelease if missing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already has a GitHub release"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes --prerelease
          fi
